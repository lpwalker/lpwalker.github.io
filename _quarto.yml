project:
  type: website
  output-dir: docs
  resources:
    - "MATH_240/Lab9.pdf"
    - "MATH_240/Lab7-8.pdf"
    - "MATH_240/Lab1.pdf"

website:
  title: "Academic Portfolio"
  favicon: images/ColgateC.png
  sidebar: 
    logo: images/ColgateSeal.png
    style: "docked"
    collapse-level: 1
    search: false
    contents:
      - href: index.qmd
        text: " Home"
        icon: house
      - href: about.qmd
        text: " About"
        icon: person
      - href: ai-use.qmd
        text: " Statement on AI"
        icon: robot
      # MATH 240
      - section: "Computational Statistics"
        contents:
          - text: "Lab 1: Objects in R"
            href: MATH_240/Lab1.pdf
          - text: "Lab 7-8: Point Estimation"
            href: MATH_240/Lab7-8.pdf
          - text: "Lab 9: Variance"
            href: MATH_240/Lab9.pdf
      # MATH 354
      - section: "Data Analysis 1"
        contents:
          - text: "HW1: One Sample Inference"
            href: MATH_354/HW1.qmd
          - text: "HW2: k Sample Inference"
            href: MATH_354/HW2.qmd
  page-footer:
    left: "© 2026 Colgate University Student Portfolio"
    right: "[GitHub Source](https://github.com/lpwalker)"
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    number-sections: true      # Number Sections
    code-fold: true            # Button to show code
    code-line-numbers: true    # Line numbers printed in code
    cap-location: top          # Captions at the top of tables and figures
  pdf:        # Specify .pdf formatting options 
    documentclass: article     # Document Class
    number-sections: true      # Number Sections
    reference-section-title: "References" # Title for reference section
    code-line-numbers: true    # Line numbers printed in code
    cap-location: top          # Captions at the top of tables 
    geometry:
      - top=0.75in
      - left=0.75in
      - bottom=0.75in
      - right=0.75in
format-links: [pdf]